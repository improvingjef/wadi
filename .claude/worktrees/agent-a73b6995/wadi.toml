workspace = "wadi"
version = 1

[library.wadi_core]
dir = "src"
modules = ["string_util", "fs", "process", "toolchain", "manifest", "explain", "layout", "builder", "status", "doctor", "watch", "actioner", "cleaner", "promoter", "installer", "deps", "ppx_tool", "env_report", "graph", "vendor", "init", "locker", "migrate", "repl", "release_metadata", "release_artifacts", "packager", "maintenance", "bootstrap", "bench"]
packages = ["unix"]

[executable.wadi]
dir = "src"
main = "main"
modules = ["tester", "cli"]
deps = ["wadi_core"]

[test.test_runner]
dir = "test"
main = "test_main"
modules = ["test_support", "test_release_metadata", "test_transforms", "test_manifest", "test_layout", "test_build", "test_clean", "test_process", "test_run", "test_status", "test_doctor", "test_watch", "test_bench", "test_graph", "test_deps", "test_init", "test_lock", "test_vendor", "test_env", "test_migrate", "test_repl", "test_test", "test_install", "test_packaging", "test_toolchain", "test_explain", "test_bootstrap"]
deps = ["wadi_core"]
