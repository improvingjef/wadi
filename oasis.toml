workspace = "oasis"
version = 1

[library.oasis_core]
dir = "src"
modules = ["string_util", "fs", "process", "toolchain", "manifest", "explain", "layout", "builder", "cleaner", "installer", "deps", "env_report", "graph", "migrate", "repl", "bootstrap", "bench"]
packages = ["unix"]

[executable.oasis]
dir = "src"
main = "main"
modules = ["tester", "cli"]
deps = ["oasis_core"]

[test.test_runner]
dir = "test"
main = "test_main"
modules = ["test_support", "test_manifest", "test_layout", "test_build", "test_clean", "test_process", "test_run", "test_bench", "test_graph", "test_deps", "test_env", "test_migrate", "test_repl", "test_test", "test_install", "test_packaging", "test_toolchain", "test_explain", "test_bootstrap"]
deps = ["oasis_core"]
