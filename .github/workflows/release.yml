name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Validate release metadata
        run: |
          . release/metadata.sh
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            expected=$(oasis_release_tag)
            actual=${GITHUB_REF_NAME:-}
            if [ "$actual" != "$expected" ]; then
              echo "release tag '$actual' does not match metadata tag '$expected'" >&2
              exit 1
            fi
          fi

  source:
    needs: validate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build source archive
        run: ./scripts/build_release_archives.sh --source-only --output-dir dist

      - uses: actions/upload-artifact@v4
        with:
          name: release-source
          path: dist/*.tar.gz

  binaries:
    needs: validate
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            os_name: linux
            arch_name: x86_64
          - runner: macos-13
            os_name: macos
            arch_name: x86_64
          - runner: macos-14
            os_name: macos
            arch_name: arm64

    steps:
      - uses: actions/checkout@v4

      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: 5.4.0

      - name: Install OCaml dependencies
        run: opam install -y ocamlfind

      - name: Build release tree
        run: make release-artifacts

      - name: Build binary archive
        run: |
          ./scripts/build_release_archives.sh \
            --binary-only \
            --output-dir dist \
            --binary _bootstrap/bin/oasis \
            --os "${{ matrix.os_name }}" \
            --arch "${{ matrix.arch_name }}"

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.os_name }}-${{ matrix.arch_name }}
          path: dist/*.tar.gz

  publish:
    needs:
      - source
      - binaries
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Render packaging manifests
        run: |
          ./scripts/generate_packaging_manifests.sh \
            --output-dir dist \
            --reuse-source-archive-dir dist \
            --opam-output dist/oasis.opam \
            --formula-output dist/oasis.rb \
            --checksums-output dist/SHA256SUMS
          diff -u oasis.opam dist/oasis.opam
          diff -u Formula/oasis.rb dist/oasis.rb

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS
            dist/oasis.opam
            dist/oasis.rb

  homebrew_tap:
    needs:
      - source
      - binaries
    if: ${{ github.ref_type == 'tag' && secrets.HOMEBREW_TAP_TOKEN != '' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Load tap metadata
        id: metadata
        run: |
          . release/metadata.sh
          echo "tap_repo=$(oasis_homebrew_tap_repository)" >> "$GITHUB_OUTPUT"
          echo "source_archive=$(oasis_release_source_archive_name)" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - uses: actions/checkout@v4
        with:
          repository: ${{ steps.metadata.outputs.tap_repo }}
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Update Homebrew tap
        run: |
          ./scripts/update_homebrew_tap.sh \
            --tap-dir homebrew-tap \
            --source-archive "dist/${{ steps.metadata.outputs.source_archive }}" \
            --commit \
            --push
